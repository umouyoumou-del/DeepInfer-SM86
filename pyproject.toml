[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinfer-sm86"
dynamic = ["version"]
description = "DeepSeek-V2-Lite GGUF models on one NVIDIA GPU, with contexts of millions of tokens: deepinfer-cli, deepinfer-server, deepinfer-bench"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DeepInfer-SM86 contributors" }]
keywords = ["deepseek", "moe", "gguf", "long-context", "mla", "cuda", "sm86"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.5",
  "numpy>=1.24",
  "transformers>=4.49,<5",
  "accelerate>=1.3",
  "gguf>=0.19",
  "huggingface_hub>=0.26",
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
cuda = [
  "cupy-cuda12x>=14.2,<15",
  # CuPy compiles against cuda_fp16.h with NVRTC: PyTorch's Linux wheels bring both, its Windows wheels do not
  "cupy-cuda12x[ctk]>=14.2,<15; platform_system == 'Windows'",
]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
deepinfer = "deepinfer.cli.main:main"
deepinfer-cli = "deepinfer.cli.main:cli_main"
deepinfer-server = "deepinfer.cli.main:server_main"
deepinfer-bench = "deepinfer.cli.main:bench_main"

[project.urls]
Homepage = "https://github.com/umouyoumou-del/DeepInfer-SM86"
Documentation = "https://github.com/umouyoumou-del/DeepInfer-SM86/blob/main/docs/LONG_CONTEXT_1M.md"

[tool.setuptools.dynamic]
version = { attr = "deepinfer.__version__" }

[tool.setuptools.packages.find]
include = ["deepinfer*"]
namespaces = false

[tool.setuptools.package-data]
"deepinfer.cli" = ["static/*.html"]
"deepinfer.moe" = ["*.cpp"]
"deepinfer.ecs" = ["*.cpp"]
